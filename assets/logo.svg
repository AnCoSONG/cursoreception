<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="30" y1="30" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="glow" x1="50" y1="20" x2="78" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Outer recursive ring -->
  <circle cx="64" cy="64" r="44" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.35"/>

  <!-- Middle recursive ring -->
  <circle cx="64" cy="64" r="34" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 3" opacity="0.55"/>

  <!-- Inner solid ring -->
  <circle cx="64" cy="64" r="24" stroke="url(#glow)" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Circular arrow (continuous learning loop) on the inner ring -->
  <path d="M64 40 A24 24 0 1 1 42.5 76" stroke="url(#glow)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="39,71 43,79 48,73" fill="#c4b5fd"/>

  <!-- Center: upward arrow (knowledge extraction / improvement) -->
  <path d="M64 76 L64 52" stroke="#e0d4fc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M55 60 L64 50 L73 60" stroke="#e0d4fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkles representing extracted knowledge -->
  <circle cx="82" cy="38" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="90" cy="50" r="1.4" fill="#fbbf24" opacity="0.7"/>
  <circle cx="38" cy="42" r="1.6" fill="#fbbf24" opacity="0.6"/>

  <!-- Small star sparkle -->
  <path d="M86 34 L87 31 L88 34 L91 35 L88 36 L87 39 L86 36 L83 35 Z" fill="#fde68a" opacity="0.85"/>
</svg>
